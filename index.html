<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR 魔法陣召喚 シンプル版</title>

<!-- A-Frame と AR.js -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; }
</style>
</head>
<body>

<a-scene
  embedded
  arjs="sourceType: webcam; trackingBackend: artoolkit; debugUIEnabled: false;"
  renderer="antialias:true; alpha:true">

  <a-marker type="pattern" url="magic_marker.patt">
    <!-- 常に表示する魔法陣 -->
    <a-image src="magic_circle.png" rotation="-90 0 0" position="0 0 0" width="1" height="1"></a-image>

    <!-- 画像1 -->
    <a-image src="image1.png"
             rotation="-90 0 0"
             position="0 -0.1 0"
             width="0.7"
             height="0.7"
             scale="1 1 1"
             material="color:#ffffff; transparent:true">
    </a-image>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

</body>
</html>
