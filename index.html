<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法陣召喚AR</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; }
canvas#electric {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
</style>
</head>
<body>

<canvas id="electric"></canvas>

<a-scene
  embedded
  arjs="sourceType: webcam; trackingBackend: artoolkit; debugUIEnabled: false;"
  renderer="antialias:true; alpha:true">

  <!-- マーカー（紙に印刷された魔法陣を認識） -->
  <a-marker type="pattern" url="magic_marker.patt" id="marker"></a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
// マーカー取得
const marker = document.querySelector("#marker");
let img1 = null, img2 = null;

// マーカー検出で画像1召喚
marker.addEventListener("markerFound", () => {
  if (!img1) {
    img1 = document.createElement("a-image");
    img1.setAttribute("src", "image1.png");
    img1.setAttribute("rotation", "-90 0 0");
    img1.setAttribute("position", "0 0 0");
    img1.setAttribute("width", "0.7");
    img1.setAttribute("height", "0.7");
    img1.setAttribute("scale", "0.01 0.01 0.01");
    img1.setAttribute("material", "color:#ffffff; transparent:true; opacity:0");
    marker.appendChild(img1);

    // ふわっと出現アニメ
    img1.setAttribute("animation__fade", "property: material.opacity; from:0; to:1; dur:400");
    img1.setAttribute("animation__scale", "property: scale; from:0.01 0.01 0.01; to:1 1 1; dur:500; easing:easeOutElastic");
  }
});

// タップで画像1 → 画像2 + 電撃
document.addEventListener("click", (e) => {
  if (!img1 || img2) return;

  // 画像1削除
  img1.remove();
  img1 = null;

  // 画像2生成
  img2 = document.createElement("a-image");
  img2.setAttribute("src", "image2.png");
  img2.setAttribute("rotation", "-90 0 0");
  img2.setAttribute("position", "0 0 0");
  img2.setAttribute("width", "0.7");
  img2.setAttribute("height", "0.7");
  img2.setAttribute("scale", "0.01 0.01 0.01");
  img2.setAttribute("material", "color:#ffffff; transparent:true; opacity:0");
  marker.appendChild(img2);

  img2.setAttribute("animation__fade", "property: material.opacity; from:0; to:1; dur:400");
  img2.setAttribute("animation__scale", "property: scale; from:0.01 0.01 0.01; to:1 1 1; dur:500; easing:easeOutElastic");

  // 電撃演出
  startElectric();
});

// マーカー外れたら削除
marker.addEventListener("markerLost", () => {
  if (img1) { img1.remove(); img1 = null; }
  if (img2) { img2.remove(); img2 = null; }
});

// 電撃演出（Canvas）
const canvas = document.getElementById("electric");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function startElectric() {
  let f = 0;
  function draw() {
    f++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let i = 0; i < 12; i++) {
      ctx.beginPath();
      ctx.strokeStyle = `rgba(0,200,255,${Math.random()})`;
      ctx.lineWidth = 2;
      ctx.moveTo(canvas.width/2, canvas.height/2);
      ctx.lineTo(canvas.width/2 + Math.random()*200-100, canvas.height/2 + Math.random()*200-100);
      ctx.stroke();
    }
    if(f < 15) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
</script>

</body>
</html>
