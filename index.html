<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>魔法陣AR 召喚＋電気アニメ</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body { margin: 0; overflow: hidden; }
    .flash {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      top:0; left:0;
    }
    canvas#electricCanvas {
      position: absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <canvas id="electricCanvas"></canvas>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true;">
    <a-marker type="pattern" url="marker.patt">
      <!-- 魔法陣 -->
      <a-image src="magic_circle.png" position="0 0.01 0" rotation="-90 0 0" width="1" height="1"></a-image>

      <!-- 画像1 -->
      <a-image id="img1" src="image1.png" position="0 0.01 0" rotation="-90 0 0"
               width="0.8" height="0.8" visible="false" gesture-handler></a-image>

      <!-- 画像2 -->
      <a-image id="img2" src="image2.png" position="0 0.01 0" rotation="-90 0 0"
               width="0.8" height="0.8" visible="false" gesture-handler></a-image>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("a-marker");
    const img1 = document.querySelector("#img1");
    const img2 = document.querySelector("#img2");

    // 画像1フェードイン
    marker.addEventListener("markerFound", () => {
      img1.setAttribute("visible","true");
      img1.setAttribute("scale","0 0 0");
      img1.setAttribute("position","0 0 0");
      img1.setAttribute("animation__scale","property: scale; from:0 0 0; to:1 1 1; dur:800; easing:easeOutElastic");
      img1.setAttribute("animation__pos","property: position; from:0 0 0; to:0 -0.3 0; dur:800; easing:easeOutCubic");
      img1.setAttribute("animation__opacity","property: material.opacity; from:0; to:1; dur:800");
    });
    marker.addEventListener("markerLost", () => {
      img1.setAttribute("visible","false");
      img2.setAttribute("visible","false");
      img1.removeAttribute("animation__scale");
      img1.removeAttribute("animation__pos");
      img1.removeAttribute("animation__opacity");
    });

    // タップで画像2出現 + 電気演出
    img1.addEventListener("click", () => {
      img1.setAttribute("visible","false");

      img2.setAttribute("visible","true");
      img2.setAttribute("scale","0 0 0");
      img2.setAttribute("position","0 0 0");
      img2.setAttribute("animation__scale","property: scale; from:0 0 0; to:1 1 1; dur:800; easing:easeOutElastic");
      img2.setAttribute("animation__pos","property: position; from:0 0 0; to:0 -0.3 0; dur:800; easing:easeOutCubic");
      img2.setAttribute("animation__opacity","property: material.opacity; from:0; to:1; dur:800");

      startElectricAnimation();
    });

    // スワイプ・ピンチ操作
    AFRAME.registerComponent('gesture-handler', {
      init: function() {
        this.el.setAttribute('scale','1 1 1');
        this.startScale = null;
        this.el.sceneEl.canvas.addEventListener('touchstart', (evt) => {
          if(evt.touches.length==2){
            const dx = evt.touches[0].pageX - evt.touches[1].pageX;
            const dy = evt.touches[0].pageY - evt.touches[1].pageY;
            this.startDistance = Math.sqrt(dx*dx+dy*dy);
            const scale = this.el.getAttribute('scale');
            this.startScale = {x:scale.x, y:scale.y, z:scale.z};
          }
        });
        this.el.sceneEl.canvas.addEventListener('touchmove',(evt)=>{
          if(evt.touches.length==1){
            evt.preventDefault();
            const movementX = evt.touches[0].movementX || 0;
            const movementY = evt.touches[0].movementY || 0;
            const pos = this.el.getAttribute('position');
            this.el.setAttribute('position',{
              x: pos.x + movementX*0.001,
              y: pos.y,
              z: pos.z + movementY*0.001
            });
          } else if(evt.touches.length==2 && this.startScale){
            const dx = evt.touches[0].pageX - evt.touches[1].pageX;
            const dy = evt.touches[0].pageY - evt.touches[1].pageY;
            const dist = Math.sqrt(dx*dx+dy*dy);
            const scaleFactor = dist / this.startDistance;
            this.el.setAttribute('scale',{
              x: this.startScale.x*scaleFactor,
              y: this.startScale.y*scaleFactor,
              z: this.startScale.z*scaleFactor
            });
          }
        });
        this.el.sceneEl.canvas.addEventListener('touchend', (evt)=>{
          if(evt.touches.length<2) this.startScale=null;
        });
      }
    });

    // 電気アニメーション
    const canvas = document.getElementById('electricCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    function startElectricAnimation() {
      let ticks = 0;
      function draw() {
        ticks++;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let i=0;i<10;i++){
          ctx.beginPath();
          ctx.strokeStyle = `rgba(0,200,255,${Math.random()})`;
          ctx.lineWidth = 2;
          let x = Math.random()*canvas.width;
          let y = Math.random()*canvas.height;
          ctx.moveTo(x,y);
          ctx.lineTo(x+Math.random()*30-15, y+Math.random()*30-15);
          ctx.stroke();
        }
        if(ticks<15) requestAnimationFrame(draw); // 約0.5秒アニメ
        else ctx.clearRect(0,0,canvas.width,canvas.height);
      }
      draw();
    }

  </script>
</body>
</html>
