<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法陣AR 完成版</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body { margin:0; overflow:hidden; }
canvas#electricCanvas{
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="electricCanvas"></canvas>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false;"
  renderer="antialias: true; alpha: true">

  <a-marker type="pattern" url="marker.patt">

    <!-- 魔法陣 -->
    <a-image
      src="magic_circle.png"
      rotation="-90 0 0"
      position="0 0 0"
      width="1"
      height="1">
    </a-image>

    <!-- 画像1 -->
    <a-image id="img1"
      src="image1.png"
      rotation="-90 0 0"
      position="0 0.01 0"
      width="0.8"
      height="0.8"
      visible="false"
      material="transparent:true; opacity:0"
      gesture-handler>
    </a-image>

    <!-- 画像2 -->
    <a-image id="img2"
      src="image2.png"
      rotation="-90 0 0"
      position="0 0.01 0"
      width="0.8"
      height="0.8"
      visible="false"
      material="transparent:true; opacity:0"
      gesture-handler>
    </a-image>

  </a-marker>

  <!-- click判定用 -->
  <a-entity camera>
    <a-cursor></a-cursor>
  </a-entity>

</a-scene>

<script>
const marker = document.querySelector("a-marker");
const img1 = document.querySelector("#img1");
const img2 = document.querySelector("#img2");

/* ===== マーカー検出 ===== */
marker.addEventListener("markerFound", ()=>{
  showImage1();
});

marker.addEventListener("markerLost", ()=>{
  img1.setAttribute("visible","false");
  img2.setAttribute("visible","false");
});

/* ===== 画像1出現 ===== */
function showImage1(){
  img1.setAttribute("visible","true");
  img1.setAttribute("scale","0 0 0");
  img1.setAttribute("position","0 0.01 0");

  img1.setAttribute("animation__scale",
    "property: scale; from:0 0 0; to:1 1 1; dur:800; easing:easeOutElastic");
  img1.setAttribute("animation__pos",
    "property: position; from:0 0.01 0; to:0 0.3 0.01; dur:800; easing:easeOutCubic");
  img1.setAttribute("animation__opacity",
    "property: material.opacity; from:0; to:1; dur:800");
}

/* ===== タップで画像2＋電撃 ===== */
img1.addEventListener("click", ()=>{
  img1.setAttribute("visible","false");

  img2.setAttribute("visible","true");
  img2.setAttribute("scale","0 0 0");
  img2.setAttribute("position","0 0.01 0");

  img2.setAttribute("animation__scale",
    "property: scale; from:0 0 0; to:1 1 1; dur:800; easing:easeOutElastic");
  img2.setAttribute("animation__pos",
    "property: position; from:0 0.01 0; to:0 0.3 0.01; dur:800; easing:easeOutCubic");
  img2.setAttribute("animation__opacity",
    "property: material.opacity; from:0; to:1; dur:800");

  startElectric();
});

/* ===== ジェスチャ操作 ===== */
AFRAME.registerComponent('gesture-handler',{
  init:function(){
    let startDist = 0;
    let startScale = 1;

    this.el.sceneEl.canvas.addEventListener("touchstart",(e)=>{
      if(e.touches.length===2){
        startDist = getDist(e);
        startScale = this.el.object3D.scale.x;
      }
    });

    this.el.sceneEl.canvas.addEventListener("touchmove",(e)=>{
      if(e.touches.length===1){
        const pos = this.el.object3D.position;
        pos.x += e.touches[0].movementX * 0.001;
        pos.z += e.touches[0].movementY * 0.001;
      }
      if(e.touches.length===2){
        const scale = (getDist(e)/startDist)*startScale;
        this.el.object3D.scale.set(scale,scale,scale);
      }
    });
  }
});

function getDist(e){
  const dx = e.touches[0].pageX - e.touches[1].pageX;
  const dy = e.touches[0].pageY - e.touches[1].pageY;
  return Math.sqrt(dx*dx+dy*dy);
}

/* ===== 電撃演出 ===== */
const canvas = document.getElementById("electricCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function startElectric(){
  let frame = 0;
  function draw(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<12;i++){
      ctx.beginPath();
      ctx.strokeStyle = `rgba(0,200,255,${Math.random()})`;
      ctx.lineWidth = 2;
      let x = canvas.width/2 + Math.random()*200-100;
      let y = canvas.height/2 + Math.random()*200-100;
      ctx.moveTo(x,y);
      ctx.lineTo(x+Math.random()*40-20,y+Math.random()*40-20);
      ctx.stroke();
    }
    if(frame<15) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
</script>

</body>
</html>
