<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法陣召喚AR（強化版）</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; }
canvas#electric {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
</style>
</head>
<body>

<canvas id="electric"></canvas>

<a-scene
  embedded
  arjs="sourceType: webcam; trackingBackend: artoolkit; debugUIEnabled: false;"
  renderer="antialias:true; alpha:true">

  <a-marker type="pattern" url="magic_marker.patt" id="marker"></a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
// マーカー
const marker = document.querySelector("#marker");
let img1 = null, img2 = null;

// 画像比率（縦横比を合わせる）
const image1Ratio = 1.0;
const image2Ratio = 1.0;

// マーカー検出で画像1召喚
marker.addEventListener("markerFound", () => {
  if (!img1) {
    img1 = document.createElement("a-image");
    img1.setAttribute("src", "image1.png");
    img1.setAttribute("rotation", "-90 0 0");
    img1.setAttribute("position", "0 0 0");
    img1.setAttribute("width", "0.7");
    img1.setAttribute("height", (0.7 / image1Ratio).toString());
    img1.setAttribute("scale", "0.01 0.01 0.01");
    img1.setAttribute("material", "color:#ffffff; transparent:true; opacity:0");
    marker.appendChild(img1);

    // ゆっくりふわっと出現
    img1.setAttribute("animation__fade", "property: material.opacity; from:0; to:1; dur:1200");
    img1.setAttribute("animation__scale", "property: scale; from:0.01 0.01 0.01; to:1 1 1; dur:1500; easing:easeOutElastic");
  }
});

// タップで画像1 → 画像2 + 電撃
document.addEventListener("click", () => {
  if (!img1 || img2) return;

  img1.remove();
  img1 = null;

  // 画像2生成（位置は画像1と同じ）
  img2 = document.createElement("a-image");
  img2.setAttribute("src", "image2.png");
  img2.setAttribute("rotation", "-90 0 0");
  img2.setAttribute("position", "0 0 0");
  img2.setAttribute("width", "0.7");
  img2.setAttribute("height", (0.7 / image2Ratio).toString());
  img2.setAttribute("scale", "0.01 0.01 0.01");
  img2.setAttribute("material", "color:#ffffff; transparent:true; opacity:0");
  marker.appendChild(img2);

  // ゆっくり出現
  img2.setAttribute("animation__fade", "property: material.opacity; from:0; to:1; dur:1200");
  img2.setAttribute("animation__scale", "property: scale; from:0.01 0.01 0.01; to:1 1 1; dur:1500; easing:easeOutElastic");

  // 電撃演出
  startElectric();
});

// マーカー外れたら削除
marker.addEventListener("markerLost", () => {
  if (img1) { img1.remove(); img1 = null; }
  if (img2) { img2.remove(); img2 = null; }
});

// 電撃演出（派手に）
const canvas = document.getElementById("electric");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

function startElectric() {
  let f = 0;
  function draw() {
    f++;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 中心に向かって電撃
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    for (let i = 0; i < 25; i++) { // 線の本数増やす
      ctx.beginPath();
      ctx.strokeStyle = `rgba(${Math.floor(Math.random()*255)}, ${Math.floor(Math.random()*255)}, 255, ${Math.random()})`;
      ctx.lineWidth = Math.random()*3 + 1;
      const x = centerX + Math.random()*300 - 150;
      const y = centerY + Math.random()*300 - 150;
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    if(f < 40) requestAnimationFrame(draw); // 電撃長め
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
</script>

</body>
</html>
