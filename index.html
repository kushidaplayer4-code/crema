<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>魔法陣AR召喚</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body { margin: 0; overflow: hidden; }
    #shot {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      background: rgba(0,0,0,0.7);
      color: #fff;
      z-index: 10;
    }
  </style>
</head>

<body>
  <button id="shot">📸 撮影</button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="preserveDrawingBuffer: true">

    <!-- マーカー -->
    <a-marker type="pattern" url="marker.patt">

      <!-- 魔法陣 -->
      <a-image
        src="magic_circle.png"
        position="0 0.01 0"
        rotation="-90 0 0"
        width="1"
        height="1"
      ></a-image>

      <!-- 召喚される画像 -->
      <a-image
        id="summon"
        src="summoned.png"
        position="0 0.05 0"
        rotation="-90 0 0"
        width="0.8"
        height="0.8"
        visible="false"
      ></a-image>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("a-marker");
    const summon = document.querySelector("#summon");

    marker.addEventListener("markerFound", () => {
      summon.setAttribute("visible", "true");
      summon.setAttribute("scale", "0 0 0");
      summon.setAttribute("animation", "property: scale; from: 0 0 0; to: 1 1 1; dur: 800; easing: easeOutElastic");
      summon.setAttribute("animation__opacity", "property: material.opacity; from: 0; to: 1; dur: 800; easing: easeOutCubic");
    });

    marker.addEventListener("markerLost", () => {
      summon.setAttribute("visible", "false");
      summon.removeAttribute("animation");
      summon.removeAttribute("animation__opacity");
    });

    // 撮影ボタン
    document.getElementById("shot").addEventListener("click", () => {
      const canvas = document.querySelector("canvas");
      const url = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = url;
      a.download = "ar_photo.png";
      a.click();
    });
  </script>
</body>
</html>
