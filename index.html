<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR STEP2 画像表示</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; }
</style>
</head>

<body>

<a-scene
  embedded
  arjs="sourceType: webcam; trackingBackend: artoolkit;"
  renderer="antialias:true; alpha:true">

  <a-marker type="pattern" url="magic_marker.patt">

    <!-- ここで画像が見えれば成功 -->
    <a-image
      src="image1.png"
      rotation="-90 0 0"
      position="0 0.3 0"
      width="0.7"
      height="0.7">
    </a-image>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

</body>
</html>
