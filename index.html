<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>魔法陣AR 召喚＋電撃＋操作</title>

<!-- A-Frame と AR.js -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
body { margin:0; overflow:hidden; }
canvas#electric {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
}
</style>
</head>

<body>
<canvas id="electric"></canvas>

<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: true;"
  renderer="antialias: true; alpha: true">

  <!-- ARマーカー（強化魔法陣） -->
  <a-marker type="pattern" url="magic_marker.patt">

    <!-- 魔法陣（演出用、紙の魔法陣と一致） -->
    <a-image
      src="magic_circle.png"
      rotation="-90 0 0"
      position="0 0 0"
      width="1"
      height="1">
    </a-image>

    <!-- 召喚画像1 -->
    <a-image id="img1"
      src="image1.png"
      rotation="-90 0 0"
      position="0 0.01 0"
      width="0.7"
      height="0.7"
      visible="false"
      material="transparent:true; opacity:0"
      gesture-handler>
    </a-image>

    <!-- 召喚画像2 -->
    <a-image id="img2"
      src="image2.png"
      rotation="-90 0 0"
      position="0 0.01 0"
      width="0.7"
      height="0.7"
      visible="false"
      material="transparent:true; opacity:0"
      gesture-handler>
    </a-image>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const marker = document.querySelector("a-marker");
const img1 = document.querySelector("#img1");
const img2 = document.querySelector("#img2");

/* マーカー検出 */
marker.addEventListener("markerFound", ()=>{
  summon1();
});

marker.addEventListener("markerLost", ()=>{
  img1.setAttribute("visible","false");
  img2.setAttribute("visible","false");
});

/* 画像1召喚 */
function summon1(){
  img1.setAttribute("visible","true");
  img1.setAttribute("scale","0 0 0");

  img1.setAttribute("animation__scale",
    "property: scale; from:0 0 0; to:1 1 1; dur:700; easing:easeOutElastic");
  img1.setAttribute("animation__pos",
    "property: position; from:0 0.01 0; to:0 0.3 0; dur:700; easing:easeOutCubic");
  img1.setAttribute("animation__opacity",
    "property: material.opacity; from:0; to:1; dur:700");
}

/* タップで画像2 */
img1.addEventListener("click", ()=>{
  img1.setAttribute("visible","false");
  summon2();
});

function summon2(){
  img2.setAttribute("visible","true");
  img2.setAttribute("scale","0 0 0");

  img2.setAttribute("animation__scale",
    "property: scale; from:0 0 0; to:1 1 1; dur:700; easing:easeOutElastic");
  img2.setAttribute("animation__pos",
    "property: position; from:0 0.01 0; to:0 0.3 0; dur:700; easing:easeOutCubic");
  img2.setAttribute("animation__opacity",
    "property: material.opacity; from:0; to:1; dur:700");

  electric();
}

/* ジェスチャ操作（スワイプ・ピンチ） */
AFRAME.registerComponent("gesture-handler",{
  init:function(){
    let startDist = 0;
    let startScale = 1;

    this.el.sceneEl.canvas.addEventListener("touchstart",(e)=>{
      if(e.touches.length===2){
        startDist = dist(e);
        startScale = this.el.object3D.scale.x;
      }
    });

    this.el.sceneEl.canvas.addEventListener("touchmove",(e)=>{
      if(e.touches.length===1){
        this.el.object3D.position.x += e.touches[0].movementX * 0.001;
        this.el.object3D.position.z += e.touches[0].movementY * 0.001;
      }
      if(e.touches.length===2){
        const s = (dist(e)/startDist)*startScale;
        this.el.object3D.scale.set(s,s,s);
      }
    });
  }
});

function dist(e){
  const dx = e.touches[0].pageX - e.touches[1].pageX;
  const dy = e.touches[0].pageY - e.touches[1].pageY;
  return Math.sqrt(dx*dx+dy*dy);
}

/* 電撃アニメーション */
const c = document.getElementById("electric");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

function electric(){
  let f=0;
  function draw(){
    f++;
    ctx.clearRect(0,0,c.width,c.height);
    for(let i=0;i<12;i++){
      ctx.beginPath();
      ctx.strokeStyle = `rgba(0,200,255,${Math.random()})`;
      ctx.lineWidth=2;
      ctx.moveTo(c.width/2,c.height/2);
      ctx.lineTo(
        c.width/2 + Math.random()*200-100,
        c.height/2 + Math.random()*200-100
      );
      ctx.stroke();
    }
    if(f<12) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,c.width,c.height);
  }
  draw();
}
</script>

</body>
</html>
